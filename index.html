<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채권현황 대시보드 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0f1117;--s1:#181c27;--s2:#1e2333;--s3:#252a3a;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.11);
  --t1:#e8eaf0;--t2:#8b92a8;--t3:#4e5568;
  --acc:#4f8ef7;--grn:#36c98a;--red:#f05a5a;--amb:#f0a050;--tel:#36c9c0;--pur:#9b7cf7;
  --fn:'Noto Sans KR',sans-serif;--mo:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fn);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;min-height:100vh;}

/* ── HEADER ─────────────────────────── */
.hd{background:var(--s1);border-bottom:1px solid var(--b2);padding:0 24px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:200;min-height:54px;}
.hd-brand{display:flex;align-items:center;gap:10px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);}
.hd-title{font-size:14px;font-weight:600;letter-spacing:-0.3px;}
.hd-sub{font-size:11px;color:var(--t2);margin-top:1px;font-family:var(--mo);}
.mtabs{display:flex;align-items:flex-end;gap:2px;padding-bottom:0;}
.mtab{padding:10px 18px 10px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;transition:all .15s;margin-bottom:-1px;white-space:nowrap;line-height:1.3;}
.mtab:hover{color:var(--t1);background:var(--s2);}
.mtab.on{color:#fff;background:var(--acc);border-color:var(--acc);font-weight:600;}
.mtab-amt{font-size:10px;display:block;opacity:.8;font-family:var(--mo);}

/* ── MAIN ───────────────────────────── */
.main{padding:20px 24px;max-width:1680px;margin:0 auto;}
.ptabs{display:flex;gap:3px;margin-bottom:18px;border-bottom:1px solid var(--b1);}
.ptab{padding:8px 16px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;transition:all .15s;margin-bottom:-1px;}
.ptab:hover{color:var(--t1);background:var(--s2);}
.ptab.on{color:var(--acc);background:var(--s2);border-color:var(--b2);border-bottom-color:var(--s2);}
.pg{display:none;}.pg.on{display:block;}

/* ── METRIC CARDS ───────────────────── */
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px;}
.mc{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden;}
.mc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;}
.mc.a::before{background:var(--acc)}.mc.g::before{background:var(--grn)}.mc.r::before{background:var(--red)}.mc.o::before{background:var(--amb)}.mc.t::before{background:var(--tel)}
.mc-lbl{font-size:10px;color:var(--t2);font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px;}
.mc-val{font-size:18px;font-weight:700;font-family:var(--mo);letter-spacing:-.5px;}
.mc-val.a{color:var(--acc)}.mc-val.g{color:var(--grn)}.mc-val.r{color:var(--red)}.mc-val.o{color:var(--amb)}.mc-val.t{color:var(--tel)}
.mc-sub{font-size:10px;color:var(--t3);margin-top:2px;font-family:var(--mo);}

/* ── CHARTS ─────────────────────────── */
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.cc{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:16px;}
.cc-full{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:16px;margin-bottom:16px;}
.cc-title{font-size:12px;font-weight:600;margin-bottom:12px;color:var(--t1);display:flex;justify-content:space-between;align-items:center;}
.cc-hint{font-size:10px;color:var(--t3);font-family:var(--mo);}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t2);}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* ── FILTER BAR ─────────────────────── */
.fb{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:11px 15px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
.fg{display:flex;align-items:center;gap:6px;}
.fl{font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
select,input[type=text]{background:var(--s3);border:1px solid var(--b2);border-radius:6px;color:var(--t1);font-size:12px;font-family:var(--fn);padding:5px 8px;cursor:pointer;outline:none;transition:border-color .15s;}
select:focus,input:focus{border-color:var(--acc);}
.ck{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);cursor:pointer;padding:5px 9px;background:var(--s3);border:1px solid var(--b1);border-radius:6px;transition:all .15s;user-select:none;}
.ck input{display:none;}.ck-d{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--t3);}
.ck.on{color:var(--acc);border-color:var(--acc);background:rgba(79,142,247,.1);}
.ck.on .ck-d{background:var(--acc);border-color:var(--acc);}
.fcnt{margin-left:auto;font-size:11px;color:var(--t3);font-family:var(--mo);}

/* ── INFO BOX ───────────────────────── */
.ib{background:rgba(79,142,247,.07);border:1px solid rgba(79,142,247,.18);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--t2);margin-bottom:12px;line-height:1.8;}
.ib strong{color:var(--t1);}

/* ── SUMMARY CARDS ──────────────────── */
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-bottom:14px;}

/* ── TABLE ──────────────────────────── */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--b1);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--s3);color:var(--t2);font-weight:500;padding:9px 10px;text-align:right;border-bottom:1px solid var(--b2);white-space:nowrap;cursor:pointer;user-select:none;font-size:11px;}
thead th.L{text-align:left;}
thead th:hover{color:var(--t1);}
tbody tr{border-bottom:1px solid var(--b1);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.02);}
tbody tr.TR{background:rgba(240,90,90,.07);}tbody tr.TR:hover{background:rgba(240,90,90,.12);}
tbody tr.TA{background:rgba(240,160,80,.06);}tbody tr.TA:hover{background:rgba(240,160,80,.1);}
tbody tr.TG{background:var(--s3);}
tbody tr.TM{background:rgba(79,142,247,.04);}
tbody tr.TOT td{font-weight:600;color:var(--t1)!important;background:rgba(79,142,247,.05);border-top:1px solid var(--b2);}
tbody td{padding:7px 10px;text-align:right;color:var(--t2);white-space:nowrap;font-size:12px;}
tbody td.L{text-align:left;color:var(--t1);}
.nc{font-family:var(--mo);font-size:11px;}
.nr{color:var(--red)!important;}.ng{color:var(--grn)!important;}.na{color:var(--amb)!important;}.nb{color:var(--acc)!important;}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;}
.b-r{background:rgba(240,90,90,.18);color:var(--red);}
.b-a{background:rgba(240,160,80,.18);color:var(--amb);}
.b-g{background:rgba(54,201,138,.18);color:var(--grn);}
.b-b{background:rgba(79,142,247,.18);color:var(--acc);}
.b-n{background:rgba(255,255,255,.08);color:var(--t2);}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:var(--s1);}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px;}
@media(max-width:900px){.cg2{grid-template-columns:1fr;}.main{padding:12px;}.hd{padding:0 12px;}.mtabs{overflow-x:auto;}}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-brand">
    <div class="dot"></div>
    <div>
      <div class="hd-title">채권현황 대시보드</div>
      <div class="hd-sub">마이너스·0원·1원 제외 | 폐업처 별도 | 기준: 2026년</div>
    </div>
  </div>
  <div class="mtabs" id="mtabs">
    <div class="mtab" data-m="m01" onclick="switchMonth('m01')">01월<span class="mtab-amt" id="ma-m01"></span></div>
    <div class="mtab" data-m="m02" onclick="switchMonth('m02')">02월<span class="mtab-amt" id="ma-m02"></span></div>
    <div class="mtab" data-m="m03" onclick="switchMonth('m03')">03월<span class="mtab-amt" id="ma-m03"></span></div>
    <div class="mtab on" data-m="m04" onclick="switchMonth('m04')">04월<span class="mtab-amt" id="ma-m04"></span></div>
  </div>
</div>

<div class="main">
  <div class="ptabs">
    <div class="ptab on" onclick="switchPage('ov')">📊 사무소별 현황</div>
    <div class="ptab" onclick="switchPage('tr')">📈 월별 추이</div>
    <div class="ptab" onclick="switchPage('sm')">👤 담당자별 요약</div>
    <div class="ptab" onclick="switchPage('dt')">🔍 거래처 상세</div>
  </div>

  <!-- PAGE: 사무소별 현황 -->
  <div class="pg on" id="pg-ov">
    <div class="mcards" id="ov-cards"></div>
    <div class="cc-full">
      <div class="cc-title">
        <span id="bar-ttl">사무소별 채권 현황</span>
        <span class="cc-hint">총 채권 대비 비율 | 단위: 억원</span>
      </div>
      <div style="position:relative;height:290px"><canvas id="barC"></canvas></div>
      <div class="legend" id="bar-leg"></div>
    </div>
    <div class="cg2">
      <div class="cc"><div class="cc-title">채권 비율</div><div style="height:240px;position:relative"><canvas id="pieC"></canvas></div></div>
      <div class="cc"><div class="cc-title">수금대상액 비율</div><div style="height:240px;position:relative"><canvas id="colC"></canvas></div></div>
    </div>
  </div>

  <!-- PAGE: 월별 추이 -->
  <div class="pg" id="pg-tr">
    <div class="cc-full">
      <div class="cc-title"><span>월별 채권 추이 (억원)</span><span class="cc-hint">거래 없는 사무소 제외</span></div>
      <div style="height:310px;position:relative"><canvas id="trC"></canvas></div>
    </div>
    <div class="cc-full">
      <div class="cc-title"><span>사무소별 수금대상액 추이 (억원)</span></div>
      <div style="height:260px;position:relative"><canvas id="trC2"></canvas></div>
    </div>
    <div class="tw" id="tr-tbl"></div>
  </div>

  <!-- PAGE: 담당자별 요약 -->
  <div class="pg" id="pg-sm">
    <div class="fb">
      <div class="fg"><span class="fl">사무소</span>
        <select id="sm-off" onchange="onSmOff()"><option value="">전체</option></select></div>
      <div class="fg"><span class="fl">담당자</span>
        <select id="sm-mgr" onchange="renderSm()"><option value="">전체</option></select></div>
      <label class="ck on" id="ck-delay" onclick="toggleSmDelay()"><input type="checkbox"><div class="ck-d"></div>회전지연 강조</label>
      <span class="fcnt" id="sm-cnt"></span>
    </div>
    <div class="scards" id="sm-cards"></div>
    <div class="tw"><table>
      <thead><tr>
        <th class="L" style="width:155px">사무소</th>
        <th class="L" style="width:90px">담당자</th>
        <th class="L" style="width:130px">거래구분</th>
        <th style="width:60px">거래처수</th>
        <th style="min-width:130px">채권 합계</th>
        <th style="min-width:130px">수금대상액</th>
        <th style="width:75px">회전지연</th>
      </tr></thead>
      <tbody id="sm-body"></tbody>
    </table></div>
  </div>

  <!-- PAGE: 거래처 상세 -->
  <div class="pg" id="pg-dt">
    <!-- 빠른 필터 버튼 -->
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      <span style="font-size:11px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-right:4px">빠른 필터</span>
      <button id="qf-all" onclick="quickFilter('all')"
        style="padding:8px 18px;border-radius:8px;border:1.5px solid var(--b2);background:var(--acc);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all .15s">
        전체
      </button>
      <button id="qf-red" onclick="quickFilter('red')"
        style="padding:8px 18px;border-radius:8px;border:1.5px solid var(--b2);background:var(--s3);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all .15s">
        🔴 회전지연처만
      </button>
      <button id="qf-cls" onclick="quickFilter('cls')"
        style="padding:8px 18px;border-radius:8px;border:1.5px solid var(--b2);background:var(--s3);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all .15s">
        🟠 폐업처만
      </button>
    </div>
    <div class="fb">
      <div class="fg"><span class="fl">사무소</span>
        <select id="dt-off" onchange="onDtOff()"><option value="">전체</option></select></div>
      <div class="fg"><span class="fl">담당자</span>
        <select id="dt-mgr" onchange="renderDt()"><option value="">전체</option></select></div>
      <div class="fg"><span class="fl">거래구분</span>
        <select id="dt-type" onchange="renderDt()"><option value="">전체</option></select></div>
      <div class="fg"><input type="text" id="dt-srch" placeholder="거래처명 검색..." oninput="renderDt()" style="width:160px"></div>
      <span class="fcnt" id="dt-cnt"></span>
    </div>
    <div class="ib" id="dt-ib"></div>
    <div class="tw"><table>
      <thead><tr>
        <th class="L" onclick="sortDt(0)">사무소</th>
        <th class="L" onclick="sortDt(1)">담당자</th>
        <th class="L" onclick="sortDt(2)">거래처명</th>
        <th class="L" onclick="sortDt(3)">거래구분</th>
        <th onclick="sortDt(4)">기준회전일</th>
        <th onclick="sortDt(5)">실회전일</th>
        <th onclick="sortDt(6)">회전지연일</th>
        <th onclick="sortDt(7)">채권</th>
        <th onclick="sortDt(8)">수금대상액</th>
        <th>상태</th>
      </tr></thead>
      <tbody id="dt-body"></tbody>
    </table></div>
  </div>

const TYPE_ORDER = ['선수금처','월말결재처','예외처','담보처','상급,준종합,의원','채권의뢰처','관계사'];

const fmtW = n => Math.round(n).toLocaleString('ko-KR');
const fmtA = n => { // 억 단위 표기
  const a=Math.abs(n);
  if(a>=1e10) return (n/1e8).toFixed(0)+'억';
  if(a>=1e9)  return (n/1e8).toFixed(1)+'억';
  if(a>=1e8)  return (n/1e8).toFixed(2)+'억';
  if(a>=1e4)  return Math.round(n/1e4).toLocaleString()+'만';
  return fmtW(n);
};
const bclr = t => ({선수금처:'b-b',월말결재처:'b-g',예외처:'b-n',담보처:'b-n','상급,준종합,의원':'b-n',폐업처:'b-a',채권의뢰처:'b-r',관계사:'b-n'}[t]||'b-n');

let curM = 'm04';
let smDelay = true;
let dtFlt = {red:false,cls:false,sortCol:-1,sortAsc:true};
let barCI=null,pieCI=null,colCI=null,trCI=null,trCI2=null;

/* ── 데이터 필터 함수 ─────────────────────────── */
// 집계용: 폐업처 제외, 채권>1
const getMain = m => D.filter(r => !r.is_폐업 && r[m].채권 > 1);
// 상세용: 폐업처는 마이너스도 포함, 나머지는 채권!=0 (단 1원 제외)
const getDetail = m => D.filter(r => {
  if(r.is_폐업) return r[m].채권 !== 0; // 폐업처는 0원만 제외
  return r[m].채권 > 1; // 일반: 마이너스·0·1원 제외
});

// 사무소별 (활성: 어느 달이든 채권>1인 행이 있는 사무소)
const ACTIVE_OFFICES = [...new Set(
  D.filter(r => !r.is_폐업 && MONTHS.some(m => r[m].채권 > 1)).map(r => r.사무소명)
)].sort();
const ALL_OFFICES = [...new Set(D.map(r=>r.사무소명))].sort();
const ALL_TYPES = [...new Set(D.map(r=>r.거래구분))].sort();

/* ── 월 탭 초기화 ─────────────────────────────── */
function initMonthTabs() {
  MONTHS.forEach(m => {
    const t = getMain(m).reduce((s,r)=>s+r[m].채권,0);
    document.getElementById(`ma-${m}`).textContent = fmtA(t);
  });
}

/* ── 월 전환 ──────────────────────────────────── */
function switchMonth(m) {
  curM = m;
  document.querySelectorAll('.mtab').forEach(el => el.classList.toggle('on', el.dataset.m===m));
  renderOv(); renderSm(); renderDt();
}

/* ── 페이지 전환 ──────────────────────────────── */
function switchPage(name) {
  document.querySelectorAll('.ptab').forEach((el,i) => {
    el.classList.toggle('on', ['ov','tr','sm','dt'][i]===name);
  });
  document.querySelectorAll('.pg').forEach(el => {
    el.classList.toggle('on', el.id===`pg-${name}`);
  });
  if(name==='tr' && !trCI) renderTr();
}

/* ── PAGE 1: 사무소별 현황 ────────────────────── */
function renderOv() {
  const m = curM;
  const rows = getMain(m);
  const byOff = {};
  rows.forEach(r => {
    if(!byOff[r.사무소명]) byOff[r.사무소명]={채권:0,수금:0};
    byOff[r.사무소명].채권 += r[m].채권;
    byOff[r.사무소명].수금 += r[m].수금대상액;
  });
  const offices = Object.entries(byOff).sort((a,b)=>b[1].채권-a[1].채권);
  const totalBond = offices.reduce((s,[,v])=>s+v.채권,0);
  const totalCol  = offices.reduce((s,[,v])=>s+v.수금,0);
  const delayCnt  = rows.filter(r=>r[m].is_회전지연).length;
  // 폐업처: 어느 월이든 채권 != 0 인 것
  const closedCnt = D.filter(r=>r.is_폐업 && MONTHS.some(mm=>r[mm].채권!==0)).length;

  document.getElementById('ov-cards').innerHTML = `
    <div class="mc a"><div class="mc-lbl">총 채권 (${MLBL[m]})</div><div class="mc-val a">${fmtA(totalBond)}</div><div class="mc-sub">${fmtW(totalBond)} 원</div></div>
    <div class="mc g"><div class="mc-lbl">수금 대상액</div><div class="mc-val g">${fmtA(totalCol)}</div><div class="mc-sub">${fmtW(totalCol)} 원</div></div>
    <div class="mc r"><div class="mc-lbl">회전 지연 거래처</div><div class="mc-val r">${delayCnt}건</div><div class="mc-sub">기준-실회전일 &lt; 0</div></div>
    <div class="mc o"><div class="mc-lbl">폐업처</div><div class="mc-val o">${closedCnt}건</div><div class="mc-sub">채권 보유 폐업처</div></div>
    <div class="mc t"><div class="mc-lbl">활성 사무소</div><div class="mc-val t">${offices.length}개</div><div class="mc-sub">총 ${rows.length}건</div></div>`;

  document.getElementById('bar-ttl').textContent = `사무소별 채권 현황 (${MLBL[m]})`;
  const labels = offices.map(([k])=>k.replace('CG_',''));
  const bonds  = offices.map(([,v])=>+(v.채권/1e8).toFixed(2));
  const cols   = offices.map(([,v])=>+(v.수금/1e8).toFixed(2));
  const ratios = offices.map(([,v])=>((v.채권/totalBond)*100).toFixed(1));

  if(barCI) barCI.destroy();
  barCI = new Chart(document.getElementById('barC').getContext('2d'), {
    type:'bar',
    data:{labels,datasets:[
      {label:'채권(억)',data:bonds,backgroundColor:'rgba(79,142,247,.75)',borderRadius:4},
      {label:'수금대상액(억)',data:cols,backgroundColor:'rgba(54,201,138,.6)',borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{
      legend:{labels:{color:'#8b92a8',font:{size:11},boxWidth:10}},
      tooltip:{callbacks:{
        label:ctx=>` ${ctx.dataset.label}: ${ctx.raw}억원`,
        afterBody:items=>[`총채권 비율: ${ratios[items[0].dataIndex]}%`]
      }}
    },scales:{
      x:{ticks:{color:'#8b92a8',font:{size:11}},grid:{color:'rgba(255,255,255,.04)'}},
      y:{ticks:{color:'#8b92a8',font:{size:10},callback:v=>v+'억'},grid:{color:'rgba(255,255,255,.04)'}}
    }}
  });

  document.getElementById('bar-leg').innerHTML = offices.map(([k,v],i)=>`
    <div class="li"><div class="ld" style="background:${COLORS[i]||'#888'}"></div>
    ${k.replace('CG_','')}: <strong style="color:var(--t1)">${ratios[i]}%</strong> (${fmtA(v.채권)})</div>`).join('');

  const mkD = (id,vals,lbls,rats,prev) => {
    if(prev) prev.destroy();
    return new Chart(document.getElementById(id).getContext('2d'),{
      type:'doughnut',
      data:{labels:lbls,datasets:[{data:vals,backgroundColor:COLORS,borderWidth:0,hoverOffset:5}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{
        legend:{position:'bottom',labels:{color:'#8b92a8',font:{size:10},padding:7,boxWidth:9}},
        tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${rats[ctx.dataIndex]}% (${fmtA(ctx.raw*1e8)})`}}
      }}
    });
  };
  pieCI = mkD('pieC',bonds,labels,ratios,pieCI);
  const cr = offices.map(([,v])=>((v.수금/totalCol)*100).toFixed(1));
  colCI = mkD('colC',cols,labels,cr,colCI);
}

/* ── PAGE 2: 월별 추이 ────────────────────────── */
function renderTr() {
  const od = {};
  ACTIVE_OFFICES.forEach(o => { od[o]={}; });
  MONTHS.forEach(m => {
    const byOff = {};
    getMain(m).forEach(r => {
      if(!byOff[r.사무소명]) byOff[r.사무소명]={채권:0,수금:0};
      byOff[r.사무소명].채권 += r[m].채권;
      byOff[r.사무소명].수금 += r[m].수금대상액;
    });
    ACTIVE_OFFICES.forEach(o => { od[o][m] = byOff[o]||{채권:0,수금:0}; });
  });
  const mLbls = MONTHS.map(m=>MLBL[m]);
  const totals = MONTHS.map(m=>getMain(m).reduce((s,r)=>s+r[m].채권,0));
  const totCol = MONTHS.map(m=>getMain(m).reduce((s,r)=>s+r[m].수금대상액,0));

  if(trCI) trCI.destroy();
  trCI = new Chart(document.getElementById('trC').getContext('2d'),{
    type:'line',
    data:{labels:mLbls,datasets:[
      {label:'전체',data:totals.map(v=>+(v/1e8).toFixed(1)),
        borderColor:'#4f8ef7',backgroundColor:'rgba(79,142,247,.1)',
        tension:.3,pointRadius:5,pointHoverRadius:7,fill:true,borderWidth:2},
      ...ACTIVE_OFFICES.map((o,i)=>({
        label:o.replace('CG_',''),
        data:MONTHS.map(m=>+(od[o][m].채권/1e8).toFixed(1)),
        borderColor:COLORS[i+1]||'#888',backgroundColor:'transparent',
        tension:.3,pointRadius:3,borderWidth:1.5,
        borderDash: i>4?[4,3]:[],
      }))
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{
      legend:{labels:{color:'#8b92a8',font:{size:10},boxWidth:10,padding:8}},
      tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.raw}억원`}}
    },scales:{
      x:{ticks:{color:'#8b92a8',font:{size:11}},grid:{color:'rgba(255,255,255,.04)'}},
      y:{ticks:{color:'#8b92a8',font:{size:10},callback:v=>v+'억'},grid:{color:'rgba(255,255,255,.04)'}}
    }}
  });

  if(trCI2) trCI2.destroy();
  trCI2 = new Chart(document.getElementById('trC2').getContext('2d'),{
    type:'bar',
    data:{labels:mLbls,datasets:ACTIVE_OFFICES.map((o,i)=>({
      label:o.replace('CG_',''),
      data:MONTHS.map(m=>+(od[o][m].수금/1e8).toFixed(2)),
      backgroundColor:COLORS[i]||'#888',borderRadius:3
    }))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{
      legend:{labels:{color:'#8b92a8',font:{size:10},boxWidth:10,padding:8}},
      tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.raw}억원`}}
    },scales:{
      x:{stacked:true,ticks:{color:'#8b92a8',font:{size:11}},grid:{color:'rgba(255,255,255,.04)'}},
      y:{stacked:true,ticks:{color:'#8b92a8',font:{size:10},callback:v=>v+'억'},grid:{color:'rgba(255,255,255,.04)'}}
    }}
  });

  // 요약 테이블
  let h=`<table><thead><tr><th class="L">사무소</th>
    ${MONTHS.map(m=>`<th>${MLBL[m]} 채권</th><th style="color:var(--grn)">${MLBL[m]} 수금</th>`).join('')}
  </tr></thead><tbody>`;
  ACTIVE_OFFICES.forEach(o => {
    h+=`<tr><td class="L" style="font-size:12px">${o}</td>`;
    MONTHS.forEach(m => {
      h+=`<td class="nc">${fmtW(od[o][m].채권)}</td><td class="nc ng">${fmtW(od[o][m].수금)}</td>`;
    });
    h+='</tr>';
  });
  h+=`<tr class="TOT"><td class="L">합계</td>`;
  MONTHS.forEach((m,i) => {
    h+=`<td class="nc nb">${fmtW(totals[i])}</td><td class="nc ng">${fmtW(totCol[i])}</td>`;
  });
  h+='</tr></tbody></table>';
  document.getElementById('tr-tbl').innerHTML = h;
}

/* ── PAGE 3: 담당자별 요약 ─────────────────────── */
function initSmFilters() {
  const sel = document.getElementById('sm-off');
  ACTIVE_OFFICES.forEach(o => { const op=document.createElement('option');op.value=o;op.textContent=o;sel.appendChild(op); });
}
function onSmOff() {
  const off = document.getElementById('sm-off').value;
  const msel = document.getElementById('sm-mgr');
  msel.innerHTML = '<option value="">전체</option>';
  // 폐업처 제외, 채권>1 기준으로 담당자 목록
  const mgrs = [...new Set(getMain(curM).filter(r=>!off||r.사무소명===off).map(r=>r.담당자))].sort();
  mgrs.forEach(m => { const op=document.createElement('option');op.value=m;op.textContent=m;msel.appendChild(op); });
  renderSm();
}
function toggleSmDelay() {
  smDelay = !smDelay;
  document.getElementById('ck-delay').classList.toggle('on', smDelay);
  renderSm();
}

function renderSm() {
  const m = curM;
  const off = document.getElementById('sm-off').value;
  const mgr = document.getElementById('sm-mgr').value;

  // 집계: 폐업처 제외, 채권>1
  const map = {};
  getMain(m).forEach(r => {
    if(off && r.사무소명!==off) return;
    if(mgr && r.담당자!==mgr) return;
    const k = `${r.사무소명}||${r.담당자}||${r.거래구분}`;
    if(!map[k]) map[k]={사무소명:r.사무소명,담당자:r.담당자,거래구분:r.거래구분,cnt:0,채권:0,수금:0,지연:0};
    map[k].cnt++;
    map[k].채권 += r[m].채권;
    map[k].수금 += r[m].수금대상액;
    if(r[m].is_회전지연) map[k].지연++;
  });
  const rows = Object.values(map);

  // 소계
  const offTot={}, mgrTot={};
  rows.forEach(r => {
    if(!offTot[r.사무소명]) offTot[r.사무소명]={채권:0,수금:0,cnt:0,지연:0};
    offTot[r.사무소명].채권+=r.채권; offTot[r.사무소명].수금+=r.수금;
    offTot[r.사무소명].cnt+=r.cnt;   offTot[r.사무소명].지연+=r.지연;
    const mk=`${r.사무소명}||${r.담당자}`;
    if(!mgrTot[mk]) mgrTot[mk]={사무소명:r.사무소명,담당자:r.담당자,채권:0,수금:0,cnt:0,지연:0};
    mgrTot[mk].채권+=r.채권; mgrTot[mk].수금+=r.수금;
    mgrTot[mk].cnt+=r.cnt;   mgrTot[mk].지연+=r.지연;
  });

  const totBond=rows.reduce((s,r)=>s+r.채권,0);
  const totCol=rows.reduce((s,r)=>s+r.수금,0);
  const totCnt=rows.reduce((s,r)=>s+r.cnt,0);
  const totDel=rows.reduce((s,r)=>s+r.지연,0);

  // 상단 요약 카드
  let cardHtml;
  if(mgr) {
    const mk=`${off}||${mgr}`;
    const mt=mgrTot[mk]||{채권:0,수금:0,cnt:0,지연:0};
    cardHtml=`
      <div class="mc a"><div class="mc-lbl">채권 합계 — ${mgr}</div><div class="mc-val a">${fmtA(mt.채권)}</div><div class="mc-sub">${fmtW(mt.채권)} 원</div></div>
      <div class="mc g"><div class="mc-lbl">수금대상액</div><div class="mc-val g">${fmtA(mt.수금)}</div><div class="mc-sub">${fmtW(mt.수금)} 원</div></div>
      <div class="mc r"><div class="mc-lbl">회전지연</div><div class="mc-val r">${mt.지연}건</div><div class="mc-sub">기준-실 &lt; 0</div></div>
      <div class="mc t"><div class="mc-lbl">거래처 수</div><div class="mc-val t">${mt.cnt}건</div><div class="mc-sub">폐업처 제외</div></div>`;
  } else if(off) {
    const ot=offTot[off]||{채권:0,수금:0,cnt:0,지연:0};
    const mCnt=Object.values(mgrTot).filter(x=>x.사무소명===off).length;
    cardHtml=`
      <div class="mc a"><div class="mc-lbl">채권 합계 — ${off.replace('CG_','')}</div><div class="mc-val a">${fmtA(ot.채권)}</div><div class="mc-sub">${fmtW(ot.채권)} 원</div></div>
      <div class="mc g"><div class="mc-lbl">수금대상액</div><div class="mc-val g">${fmtA(ot.수금)}</div><div class="mc-sub">${fmtW(ot.수금)} 원</div></div>
      <div class="mc r"><div class="mc-lbl">회전지연</div><div class="mc-val r">${ot.지연}건</div><div class="mc-sub">기준-실 &lt; 0</div></div>
      <div class="mc t"><div class="mc-lbl">담당자 수</div><div class="mc-val t">${mCnt}명</div><div class="mc-sub">총 ${ot.cnt}건</div></div>`;
  } else {
    cardHtml=`
      <div class="mc a"><div class="mc-lbl">전체 채권 (폐업제외)</div><div class="mc-val a">${fmtA(totBond)}</div><div class="mc-sub">${fmtW(totBond)} 원</div></div>
      <div class="mc g"><div class="mc-lbl">수금대상액</div><div class="mc-val g">${fmtA(totCol)}</div><div class="mc-sub">${fmtW(totCol)} 원</div></div>
      <div class="mc r"><div class="mc-lbl">회전지연</div><div class="mc-val r">${totDel}건</div><div class="mc-sub">기준-실 &lt; 0</div></div>
      <div class="mc t"><div class="mc-lbl">거래처 수</div><div class="mc-val t">${totCnt}건</div><div class="mc-sub">폐업처 제외</div></div>`;
  }
  document.getElementById('sm-cards').innerHTML = cardHtml;
  document.getElementById('sm-cnt').textContent = `${rows.length}행`;

  // 테이블: 사무소 → 담당자 → 거래구분 3계층
  const grouped={}, offOrder=[];
  rows.forEach(r => {
    if(!grouped[r.사무소명]){grouped[r.사무소명]={};offOrder.push(r.사무소명);}
    if(!grouped[r.사무소명][r.담당자]) grouped[r.사무소명][r.담당자]=[];
    grouped[r.사무소명][r.담당자].push(r);
  });
  const sortTypes = arr => [...arr].sort((a,b)=>{
    const ai=TYPE_ORDER.indexOf(a.거래구분),bi=TYPE_ORDER.indexOf(b.거래구분);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });

  const showOff = !off, showMgr = !mgr;

  const aC=(v,bold)=>`<td style="text-align:right;font-family:var(--mo);font-size:${bold?'12':'11'}px;font-weight:${bold?'700':'400'};color:${bold?'var(--acc)':'var(--t2)'};">
    ${fmtW(v)}<br><span style="font-size:10px;font-weight:400;color:var(--t3)">${fmtA(v)}</span></td>`;
  const sC=(v,bold)=>`<td style="text-align:right;font-family:var(--mo);font-size:${bold?'12':'11'}px;font-weight:${bold?'700':'400'};color:${bold?'var(--grn)':'var(--t2)'};">
    ${fmtW(v)}<br><span style="font-size:10px;font-weight:400;color:var(--t3)">${fmtA(v)}</span></td>`;

  if(!rows.length){document.getElementById('sm-body').innerHTML=`<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--t3)">데이터 없음</td></tr>`;return;}

  let h='';
  [...new Set(offOrder)].forEach(o => {
    const ot = offTot[o];
    if(showOff) {
      h+=`<tr class="TG" style="border-top:2px solid var(--b2)">
        <td class="L" colspan="3" style="font-size:12px;font-weight:700;color:var(--t1);padding:9px 10px">
          <span style="color:var(--acc)">▶</span> ${o} <span style="font-size:10px;font-weight:400;color:var(--t2);margin-left:6px">사무소 합계</span>
        </td>
        <td class="nc" style="font-weight:600;color:var(--t1)">${ot.cnt}</td>
        ${aC(ot.채권,true)}${sC(ot.수금,true)}
        <td class="nc nr" style="font-weight:600">${ot.지연>0?ot.지연+'건':'-'}</td></tr>`;
    }
    Object.entries(grouped[o]).forEach(([mg2,typeRows]) => {
      const mk=`${o}||${mg2}`, mt=mgrTot[mk];
      const sorted = sortTypes(typeRows);
      if(showMgr) {
        h+=`<tr class="TM" style="border-top:1px solid var(--b2)">
          <td class="L" style="padding-left:${showOff?'18px':'10px'};font-size:11px;color:var(--t3)">${o}</td>
          <td class="L" colspan="2" style="font-size:12px;font-weight:600;color:var(--t1)">
            ${mg2} <span style="font-size:10px;font-weight:400;color:var(--t3);margin-left:5px">담당자 합계</span>
          </td>
          <td class="nc" style="color:var(--t2)">${mt.cnt}</td>
          ${aC(mt.채권,true)}${sC(mt.수금,true)}
          <td class="nc nr">${mt.지연>0?mt.지연+'건':'-'}</td></tr>`;
      }
      sorted.forEach(r => {
        const isDel = smDelay && r.지연>0;
        const pi = showOff?'padding-left:34px':showMgr?'padding-left:18px':'padding-left:10px';
        h+=`<tr class="${isDel?'TR':''}">
          <td class="L" style="${pi};font-size:11px;color:var(--t3)">${r.사무소명}</td>
          <td class="L" style="font-size:12px;color:var(--t2)">${r.담당자}</td>
          <td class="L"><span class="badge ${bclr(r.거래구분)}">${r.거래구분}</span></td>
          <td class="nc">${r.cnt}</td>
          <td style="text-align:right;font-family:var(--mo);font-size:11px;color:var(--t2)">${fmtW(r.채권)}</td>
          <td style="text-align:right;font-family:var(--mo);font-size:11px;color:var(--t2)">${fmtW(r.수금)}</td>
          <td class="nc ${r.지연>0?'nr':''}">${r.지연>0?r.지연+'건':'-'}</td></tr>`;
      });
    });
  });
  h+=`<tr class="TOT" style="border-top:2px solid var(--b2)">
    <td class="L" colspan="3" style="font-size:12px">전체 합계 (폐업처 제외)</td>
    <td class="nc">${totCnt}</td>${aC(totBond,true)}${sC(totCol,true)}
    <td class="nc nr" style="font-weight:700">${totDel>0?totDel+'건':'-'}</td></tr>`;
  document.getElementById('sm-body').innerHTML = h;
}

/* ── PAGE 4: 거래처 상세 ──────────────────────── */
function initDtFilters() {
  const os=document.getElementById('dt-off');
  const ts=document.getElementById('dt-type');
  ALL_OFFICES.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;os.appendChild(op);});
  ALL_TYPES.forEach(t=>{const op=document.createElement('option');op.value=t;op.textContent=t;ts.appendChild(op);});
}
function onDtOff() {
  const off=document.getElementById('dt-off').value;
  const ms=document.getElementById('dt-mgr');
  ms.innerHTML='<option value="">전체</option>';
  // 상세에서는 모든 담당자 (폐업처 포함)
  const mgrs=[...new Set(D.filter(r=>!off||r.사무소명===off).map(r=>r.담당자))].sort();
  mgrs.forEach(m=>{const op=document.createElement('option');op.value=m;op.textContent=m;ms.appendChild(op);});
  renderDt();
}
function quickFilter(k) {
  // 라디오 방식: 선택한 것만 ON, 나머지 OFF
  dtFlt.red = (k === 'red');
  dtFlt.cls = (k === 'cls');

  // 버튼 스타일 업데이트
  const btnAll = document.getElementById('qf-all');
  const btnRed = document.getElementById('qf-red');
  const btnCls = document.getElementById('qf-cls');

  const activeStyle = 'padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all .15s;';
  const inactiveStyle = activeStyle + 'border:1.5px solid var(--b2);background:var(--s3);color:var(--t2);';

  if(k === 'all') {
    btnAll.style.cssText = activeStyle + 'border:1.5px solid var(--acc);background:var(--acc);color:#fff;';
    btnRed.style.cssText = inactiveStyle;
    btnCls.style.cssText = inactiveStyle;
  } else if(k === 'red') {
    btnAll.style.cssText = inactiveStyle;
    btnRed.style.cssText = activeStyle + 'border:1.5px solid var(--red);background:rgba(240,90,90,.18);color:var(--red);';
    btnCls.style.cssText = inactiveStyle;
  } else if(k === 'cls') {
    btnAll.style.cssText = inactiveStyle;
    btnRed.style.cssText = inactiveStyle;
    btnCls.style.cssText = activeStyle + 'border:1.5px solid var(--amb);background:rgba(240,160,80,.18);color:var(--amb);';
  }

  renderDt();
}

function toggleDt(k) {
  quickFilter(k === 'red' ? (dtFlt.red ? 'all' : 'red') : (dtFlt.cls ? 'all' : 'cls'));
}

function renderDt() {
  const m=curM;
  const off=document.getElementById('dt-off').value;
  const mgr=document.getElementById('dt-mgr').value;
  const type=document.getElementById('dt-type').value;
  const srch=document.getElementById('dt-srch').value.trim().toLowerCase();

  // 상세: 폐업처는 채권!=0, 나머지는 채권>1 (마이너스포함 모두 표시, 단 0·1 제외)
  let rows = D.filter(r => {
    // 거래처 상세: 모든 거래처 표시 (마이너스·0원·플러스 전체 포함)
    if(off && r.사무소명!==off) return false;
    if(mgr && r.담당자!==mgr) return false;
    if(type && r.거래구분!==type) return false;
    if(srch && !r.판매처명.toLowerCase().includes(srch)) return false;
    // OR 필터
    if(dtFlt.red||dtFlt.cls){
      const pr=dtFlt.red&&r[m].is_회전지연;
      const pc=dtFlt.cls&&r.is_폐업;
      if(!pr&&!pc) return false;
    }
    return true;
  });

  // 정렬
  if(dtFlt.sortCol>=0){
    const fns=[r=>r.사무소명,r=>r.담당자,r=>r.판매처명,r=>r.거래구분,r=>r.기준회전일,
               r=>r[m].실회전일,r=>r[m].회전지연일,r=>r[m].채권,r=>r[m].수금대상액];
    const fn=fns[dtFlt.sortCol];
    rows.sort((a,b)=>{
      const av=fn(a),bv=fn(b);
      if(typeof av==='string') return dtFlt.sortAsc?av.localeCompare(bv,'ko'):bv.localeCompare(av,'ko');
      return dtFlt.sortAsc?av-bv:bv-av;
    });
  }

  const tBond=rows.filter(r=>r[m].채권>0).reduce((s,r)=>s+r[m].채권,0);
  const tCol =rows.reduce((s,r)=>s+r[m].수금대상액,0);
  const tDel =rows.filter(r=>r[m].is_회전지연).length;
  const tCls =rows.filter(r=>r.is_폐업).length;

  document.getElementById('dt-cnt').textContent=`${rows.length}건`;
  document.getElementById('dt-ib').innerHTML=
    `채권 합계(+): <strong>${fmtW(tBond)} 원</strong> (${fmtA(tBond)}) &nbsp;|&nbsp; `+
    `수금대상액: <strong style="color:var(--grn)">${fmtW(tCol)} 원</strong> &nbsp;|&nbsp; `+
    `회전지연: <strong style="color:var(--red)">${tDel}건</strong> &nbsp;|&nbsp; `+
    `폐업처: <strong style="color:var(--amb)">${tCls}건</strong>`;

  const body=document.getElementById('dt-body');
  if(!rows.length){body.innerHTML=`<tr><td colspan="10" style="text-align:center;padding:28px;color:var(--t3)">데이터 없음</td></tr>`;return;}

  body.innerHTML=rows.map(r=>{
    const md=r[m];
    const rc=r.is_폐업?'TA':(md.is_회전지연?'TR':'');
    const dd=md.회전지연일;
    let badge='';
    if(r.is_폐업) badge='<span class="badge b-a">폐업</span>';
    else if(md.is_회전지연) badge=`<span class="badge b-r">지연 ${Math.abs(dd)}일</span>`;
    else badge='<span class="badge b-n">정상</span>';
    return `<tr class="${rc}">
      <td class="L">${r.사무소명}</td>
      <td class="L">${r.담당자}</td>
      <td class="L" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${r.판매처명}</td>
      <td class="L"><span class="badge ${bclr(r.거래구분)}">${r.거래구분}</span></td>
      <td class="nc">${r.기준회전일}</td>
      <td class="nc">${md.실회전일}</td>
      <td class="nc ${dd<0?'nr':dd>0?'ng':''}">${dd}</td>
      <td class="nc ${md.채권<0?'nr':''}">${fmtW(md.채권)}</td>
      <td class="nc">${fmtW(md.수금대상액)}</td>
      <td>${badge}</td></tr>`;
  }).join('');
}

function sortDt(col) {
  const ths=document.querySelectorAll('#pg-dt thead th');
  ths.forEach(th=>{th.style.color='';});
  if(dtFlt.sortCol===col) dtFlt.sortAsc=!dtFlt.sortAsc;
  else{dtFlt.sortCol=col;dtFlt.sortAsc=true;}
  ths[col].style.color='var(--acc)';
  renderDt();
}

/* ── INIT ────────────────────────────────────── */
initMonthTabs();
initSmFilters();
initDtFilters();
renderOv();
renderSm();
renderDt();
</script>
